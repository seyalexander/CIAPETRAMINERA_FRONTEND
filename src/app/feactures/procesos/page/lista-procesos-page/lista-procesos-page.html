<div class="flex flex-col gap-4 h-[calc(100dvh-160px)]">

    <!-- Encabezado -->
    <div class="flex justify-between items-center">
        <div class="flex flex-col">
            <h1 class="mb-0!">Procesos</h1>
            <p class="text-gray-500">
                Apartado para la gestión de tus Procesos
            </p>
        </div>

        <p-button icon="pi pi-plus" label="Nuevo"></p-button>
    </div>

    <!-- Tabla -->
    <p-table
        [value]="procesos"
        dataKey="id"
        stripedRows
        responsiveLayout="scroll"
        [tableStyle]="{'min-width':'75rem'}">

        <ng-template pTemplate="header">
            <tr>
                <th style="width: 70px;">ID</th>
                <th>Proceso</th>
                <th>Descripción</th>
                <th>Responsable</th>
                <th>Documentos</th>
                <th>Estado</th>
                <th style="width: 150px;">Acciones</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-proceso>

            <tr>

                <td>{{ proceso.id }}</td>

                <td>
                    <div class="flex items-center gap-2">
                        <i class="pi pi-sitemap text-primary"></i>
                        <span class="font-semibold">
                            {{ proceso.nombre }}
                        </span>
                    </div>
                </td>

                <td>{{ proceso.descripcion }}</td>

                <td>{{ proceso.responsable }}</td>

                <td>
                    <p-badge
                        [value]="proceso.totalDocumentos">
                    </p-badge>
                </td>

                <td>
                    <p-tag
                        [value]="proceso.activo ? 'Activo' : 'Inactivo'"
                        [severity]="proceso.activo ? 'success' : 'danger'">
                    </p-tag>
                </td>

                <td>

                    <div class="flex gap-2">

                        <p-button
                            icon="pi pi-pencil"
                            rounded
                            text
                            severity="secondary">
                        </p-button>

                        <p-button
                            icon="pi pi-folder-open"
                            rounded
                            text
                            severity="contrast"
                            pTooltip="Ver documentos">
                        </p-button>

                        <p-button
                            icon="pi pi-trash"
                            rounded
                            text
                            severity="danger">
                        </p-button>

                    </div>

                </td>

            </tr>

        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="7" class="text-center py-6">
                    No existen procesos registrados.
                </td>
            </tr>
        </ng-template>

    </p-table>

</div>
