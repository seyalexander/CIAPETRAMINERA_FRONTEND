<p-dialog [(visible)]="visible" [modal]="true" (onHide)="volverLista()" [style]="{ width: '28rem' }">
  <ng-template #header>
    <div class="flex items-center gap-2">
      <i class="pi pi-id-card text-xl text-primary"></i>
      <span class="font-semibold text-lg">Registrar Tipo Documento</span>
    </div>
  </ng-template>

  <div class="flex flex-col gap-4 mt-2">

    <!-- DESCRIPCIÓN -->
    <div class="flex flex-col gap-1">
      <label class="font-medium">Descripción</label>
      <input pInputText
             [(ngModel)]="tipoDocumento.descripcion"
             name="descripcion"
             placeholder="Ej: DNI, RUC, Pasaporte" />
    </div>

    <!-- CÓDIGO SUNAT -->
    <div class="flex flex-col gap-1">
      <label class="font-medium">Código SUNAT</label>
      <input pInputText
             [(ngModel)]="tipoDocumento.codigoSunat"
             name="codigoSunat"
             placeholder="Ej: 1, 6, 7"
             maxlength="2" />
    </div>

    <!-- LONGITUD -->
    <div class="grid grid-cols-2 gap-3">

      <div class="flex flex-col gap-1">
        <label class="font-medium">Longitud Min</label>
        <input pInputText
               type="number"
               placeholder="0"
               [(ngModel)]="tipoDocumento.longitudMin"
               name="longitudMin" />
      </div>

      <div class="flex flex-col gap-1">
        <label class="font-medium">Longitud Max</label>
        <input pInputText
               type="number"
               placeholder="0"
               [(ngModel)]="tipoDocumento.longitudMax"
               name="longitudMax" />
      </div>

    </div>

    <!-- TIPO CARACTER -->
    <div class="flex flex-col gap-1">
      <label class="font-medium">Tipo de Caracter</label>

      <p-select
        [options]="tiposCaracter"
        optionLabel="label"
        optionValue="value"
        [(ngModel)]="tipoDocumento.tipoCaracter"
        name="tipoCaracter"
        placeholder="Seleccione tipo"
        appendTo="body">
      </p-select>

    </div>

  </div>

  <ng-template #footer>
    <div class="flex justify-end gap-2">

      <p-button label="Cancelar" icon="pi pi-times" severity="secondary"
        [text]="true" (click)="volverLista()">
      </p-button>

      <p-button label="Guardar" icon="pi pi-check" severity="success"
        (click)="guardar()">
      </p-button>

    </div>
  </ng-template>

</p-dialog>

 <p-toast />
