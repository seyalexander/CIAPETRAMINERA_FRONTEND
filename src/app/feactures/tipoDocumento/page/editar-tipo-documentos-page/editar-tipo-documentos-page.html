<p-dialog [(visible)]="visibleEditar" [modal]="true" [style]="{ width: '28rem' }" [draggable]="false"
  [resizable]="false" (onHide)="volverLista()">

  <!-- HEADER -->
  <ng-template #header>
    <div class="flex align-items-center gap-3">
      <div class="h-12 w-12 bg-yellow-100 text-yellow-700 p-2 rounded flex items-center justify-center">
        <i class="pi pi-pencil text-lg"></i>
      </div>

      <div class="flex flex-col">
        <span class="font-semibold text-lg">Editar Tipo Documento</span>
        <small class="text-500">Actualice la información</small>
      </div>
    </div>
  </ng-template>

  <!-- CONTENIDO -->
  <div class="grid grid-cols-2 mt-8 gap-2 w-full">
    <div class="col-span-2 flex flex-col gap-8 ">
      <div class="card flex w-full p-0! mb-0!">
        <p-floatlabel class="w-full mb-0!">
          <input id="username" class="w-full" pInputText [(ngModel)]="tipoDocumentoEditar.descripcion"
            autocomplete="off" />
          <label for="username">Descripción</label>
        </p-floatlabel>
      </div>
      <div class="card flex w-full p-0! mb-0!">
        <p-floatlabel class="w-full">
          <input id="codigoSunat" class="w-full" pInputText [(ngModel)]="tipoDocumentoEditar.codigoSunat"
            autocomplete="off" />
          <label for="codigoSunat">Código SUNAT</label>
        </p-floatlabel>
      </div>
    </div>

    <div class="col-span-2 flex gap-8 mt-6">
      <div class="card flex w-full p-0! mb-0!">
        <p-floatlabel class="w-full">
          <input id="longitudMin" class="w-full" pInputText type="number" [(ngModel)]="tipoDocumentoEditar.longitudMin"
            autocomplete="off" />
          <label for="longitudMin">Longitud Mínima</label>
        </p-floatlabel>
      </div>
      <div class="card flex w-full p-0! mb-0!">
        <p-floatlabel class="w-full">
          <input id="longitudMax" class="w-full" pInputText type="number" [(ngModel)]="tipoDocumentoEditar.longitudMax"
            autocomplete="off" />
          <label for="longitudMax">Longitud Máxima</label>
        </p-floatlabel>
      </div>
    </div>

    <div class="col-span-2 flex gap-8 mt-6">
      <div class="card flex w-full p-0! mb-0!">
        <div class="w-full  flex flex-col">
          <label class="font-medium">Tipo de Caracter</label>
          <p-select [options]="tiposCaracter" optionLabel="label" optionValue="value"
            [(ngModel)]="tipoDocumentoEditar.tipoCaracter" placeholder="Seleccione" appendTo="body">
          </p-select>
        </div>
      </div>
      <div class="card flex w-full p-0! mb-0!">
        <div class="w-full flex flex-col">
          <label class="font-medium">Estado</label>
          <p-select [options]="estadosTipoDocumentos" optionLabel="label" optionValue="value"
            [(ngModel)]="tipoDocumentoEditar.estado" placeholder="Seleccione" appendTo="body">
          </p-select>
        </div>
      </div>
    </div>


  </div>

  <ng-template #footer>
    <div class="flex justify-end items-center w-full">
      <div class="flex gap-2">
        <p-button label="Cancelar" icon="pi pi-times" severity="secondary" [text]="true" (click)="volverLista()">
        </p-button>
        <p-button label="Guardar" icon="pi pi-check" severity="info" [loading]="loading" (click)="editar()">
        </p-button>
      </div>
    </div>
  </ng-template>
</p-dialog>

<p-toast />
